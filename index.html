<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhatsInTheFridge - Yuling & Ruobing's Kitchen</title>
  <!-- Tailwind CSS CDN for Modern Styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Vector Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
  </style>
</head>
<body class="bg-zinc-900 text-zinc-100 antialiased min-h-screen relative overflow-x-hidden">

  <!-- TOP NAVIGATION BAR -->
  <header class="fixed top-0 left-0 right-0 z-40 flex items-center justify-between px-6 py-4 bg-black/30 backdrop-blur-md border-b border-white/10">
    <div class="flex items-center space-x-4">
      <!-- Menu Button -->
      <button id="open-menu" class="p-2 rounded-xl bg-white/10 hover:bg-white/20 transition-all text-white flex items-center justify-center">
        <i data-lucide="menu" class="w-6 h-6"></i>
      </button>
      <!-- Logo / Brand Title -->
      <div class="flex items-center space-x-2">
        <i data-lucide="refrigerator" class="w-6 h-6 text-emerald-400"></i>
        <span class="text-lg font-bold tracking-tight text-white">WhatsInTheFridge</span>
      </div>
    </div>

    <!-- Quick Scan Button -->
    <button id="open-scan" class="flex items-center space-x-2 px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold rounded-xl shadow-lg shadow-emerald-900/30 transition-all">
      <i data-lucide="camera" class="w-4 h-4"></i>
      <span>Scan</span>
    </button>
  </header>

  <!-- SLIDE-OUT MENU DRAWER OVERLAY -->
  <div id="drawer-backdrop" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300"></div>
  
  <!-- SLIDE-OUT MENU DRAWER -->
  <aside id="drawer" class="fixed top-0 left-0 bottom-0 z-50 w-80 bg-zinc-950 border-r border-zinc-800 p-6 flex flex-col justify-between -translate-x-full transition-transform duration-300 ease-in-out">
    <div>
      <!-- Drawer Header -->
      <div class="flex items-center justify-between pb-6 mb-6 border-b border-zinc-800">
        <div class="flex items-center space-x-2">
          <i data-lucide="refrigerator" class="w-5 h-5 text-emerald-400"></i>
          <span class="font-bold text-white tracking-wide">Storage Zones</span>
        </div>
        <button id="close-menu" class="p-1 text-zinc-400 hover:text-white rounded-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Category Navigation List (The 4 exact sections requested) -->
      <nav class="space-y-2">
        <!-- 1. All Storage -->
        <button onclick="selectCategory('all')" class="nav-item w-full flex items-center justify-between p-3 rounded-xl bg-zinc-900 hover:bg-zinc-800 text-white font-medium transition-all group">
          <div class="flex items-center space-x-3">
            <i data-lucide="layout-grid" class="w-5 h-5 text-emerald-400"></i>
            <span>All Storage</span>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-zinc-500 group-hover:translate-x-0.5 transition-transform"></i>
        </button>

        <!-- 2. Cold Store (with Pantry sub-category) -->
        <div class="space-y-1">
          <button onclick="selectCategory('chilled')" class="nav-item w-full flex items-center justify-between p-3 rounded-xl hover:bg-zinc-900 text-zinc-300 hover:text-white font-medium transition-all group">
            <div class="flex items-center space-x-3">
              <i data-lucide="thermometer-snowflake" class="w-5 h-5 text-sky-400"></i>
              <span>Cold Store</span>
            </div>
            <i data-lucide="chevron-right" class="w-4 h-4 text-zinc-500 group-hover:translate-x-0.5 transition-transform"></i>
          </button>
          
          <!-- Sub-category: Pantry -->
          <button onclick="selectCategory('pantry')" class="nav-item w-full flex items-center justify-between pl-11 pr-3 py-2.5 rounded-lg text-sm hover:bg-zinc-900/60 text-zinc-400 hover:text-amber-300 font-medium transition-all group">
            <div class="flex items-center space-x-2">
              <i data-lucide="corner-down-right" class="w-3.5 h-3.5 text-zinc-600"></i>
              <span>Pantry (Door & Fresh Shelves)</span>
            </div>
          </button>
        </div>

        <!-- 3. Freezer -->
        <button onclick="selectCategory('freezer')" class="nav-item w-full flex items-center justify-between p-3 rounded-xl hover:bg-zinc-900 text-zinc-300 hover:text-white font-medium transition-all group">
          <div class="flex items-center space-x-3">
            <i data-lucide="snowflake" class="w-5 h-5 text-indigo-400"></i>
            <span>Freezer</span>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-zinc-500 group-hover:translate-x-0.5 transition-transform"></i>
        </button>

        <!-- 4. Outside Storage -->
        <button onclick="selectCategory('outside')" class="nav-item w-full flex items-center justify-between p-3 rounded-xl hover:bg-zinc-900 text-zinc-300 hover:text-white font-medium transition-all group">
          <div class="flex items-center space-x-3">
            <i data-lucide="archive" class="w-5 h-5 text-amber-500"></i>
            <span>Outside Storage</span>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-zinc-500 group-hover:translate-x-0.5 transition-transform"></i>
        </button>
      </nav>
    </div>

    <!-- Drawer Footer -->
    <div class="pt-6 border-t border-zinc-800 text-xs text-zinc-500 flex justify-between items-center">
      <span>WhatsInTheFridge App</span>
      <span class="text-zinc-600">v2.0 UI</span>
    </div>
  </aside>

  <!-- MAIN HERO SECTION (Full-Screen Poster Concept) -->
  <main class="relative w-full h-screen flex flex-col justify-center items-center text-center px-6 overflow-hidden">
    <!-- Real-food & Modern Fridge Aesthetic Background Image -->
    <div class="absolute inset-0 -z-10 bg-cover bg-center bg-no-repeat scale-105 transition-transform duration-1000"
      style="background-image: url('https://raw.githubusercontent.com/ZhangYu1ing/whatsintherefridge/master/cover.jpg');">
    </div>
    
    <!-- Dark Vignette and Gradient Overlay for Optimal Contrast -->
    <div class="absolute inset-0 -z-10 bg-gradient-to-t from-zinc-950 via-black/50 to-black/60"></div>

    <!-- Hero Content Box -->
    <div class="max-w-3xl mx-auto space-y-6 pt-16">
      <!-- Dynamic Date Badge -->
      <div class="inline-flex items-center space-x-2 px-4 py-1.5 rounded-full bg-white/10 backdrop-blur-md border border-white/15 text-xs font-semibold tracking-wider text-emerald-300 uppercase shadow-lg">
        <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
        <span id="current-date">Today</span>
      </div>

      <!-- Primary Brand Statement (Title) -->
      <h1 class="text-4xl md:text-6xl lg:text-7xl font-extrabold tracking-tight text-white leading-tight drop-shadow-md">
        THIS IS YULING AND RUOBING'S FRIDGE
      </h1>
    </div>
  </main>

  <!-- INVENTORY VIEW MODAL (Triggered when selecting items from the Drawer Menu) -->
  <div id="inventory-modal" class="fixed inset-0 z-50 bg-zinc-950/95 backdrop-blur-xl hidden flex-col p-6 md:p-12 overflow-y-auto">
    <div class="max-w-6xl mx-auto w-full space-y-8">
      <!-- Header with Category Name & Close -->
      <div class="flex items-center justify-between pb-6 border-b border-zinc-800">
        <div>
          <h2 id="view-title" class="text-3xl font-bold text-white">All Storage</h2>
          <p class="text-zinc-400 text-sm mt-1">Real-food item list in Yuling and Ruobing's home.</p>
        </div>
        <button id="close-inventory" class="p-2 bg-zinc-800 hover:bg-zinc-700 text-white rounded-xl">
          <i data-lucide="x" class="w-6 h-6"></i>
        </button>
      </div>

      <!-- Real-Food Items Grid (Clean photography-focused layout) -->
      <div id="inventory-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        <!-- Dynamic Items populated via JavaScript -->
      </div>
    </div>
  </div>

  <!-- SIMULATED CAMERA SCAN MODAL -->
  <div id="scan-modal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md hidden flex-col items-center justify-center p-6">
    <div class="max-w-md w-full bg-zinc-900 border border-zinc-800 rounded-3xl p-6 relative space-y-6">
      <button id="close-scan" class="absolute top-4 right-4 p-2 text-zinc-400 hover:text-white">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>

      <div class="text-center space-y-2">
        <h3 class="text-xl font-bold text-white">AI Real-Food Scanner</h3>
        <p class="text-xs text-zinc-400">Capturing items for Yuling & Ruobing's fridge</p>
      </div>

      <!-- Camera Viewport Simulation -->
      <div class="relative w-full h-64 bg-zinc-950 rounded-2xl overflow-hidden flex items-center justify-center border border-zinc-800">
        <img src="https://images.unsplash.com/photo-1540420773420-3366772f4999?q=80&w=600&auto=format&fit=crop" class="w-full h-full object-cover opacity-80" />
        <!-- Scanner Bounding Box -->
        <div class="absolute inset-8 border-2 border-dashed border-emerald-400 rounded-xl flex items-center justify-center bg-emerald-500/10 animate-pulse">
          <span class="bg-emerald-500 text-black text-xs font-bold px-3 py-1 rounded-full shadow">Detecting Groceries...</span>
        </div>
      </div>

      <button id="finish-scan" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl transition-all">
        Add Identified Items
      </button>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // Initialize Vector Icons
    lucide.createIcons();

    // Set Dynamic Date (Standard English Format)
    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('current-date').textContent = new Date().toLocaleDateString('en-US', options);

    // Sample Real-Food Data (No Cartoons, Crisp Photos)
    const inventoryData = [
      { id: 1, name: 'Whole Organic Milk', zone: 'chilled', category: 'Dairy', expiry: 'Fresh till Nov 12', img: 'https://images.unsplash.com/photo-1550583724-b2692b85b150?q=80&w=400&auto=format&fit=crop' },
      { id: 2, name: 'Fresh Avocados', zone: 'pantry', category: 'Produce', expiry: 'Eat soon (3 days)', img: 'https://images.unsplash.com/photo-1523049673857-eb18f1d7b578?q=80&w=400&auto=format&fit=crop' },
      { id: 3, name: 'Grass-Fed Ribeye Steak', zone: 'freezer', category: 'Meat', expiry: 'Frozen (Dec 2026)', img: 'https://images.unsplash.com/photo-1603048588665-791ca8aea617?q=80&w=400&auto=format&fit=crop' },
      { id: 4, name: 'Artisan Sourdough Bread', zone: 'outside', category: 'Pantry', expiry: 'Fresh till Nov 08', img: 'https://images.unsplash.com/photo-1586444248902-2f64eddc13df?q=80&w=400&auto=format&fit=crop' },
      { id: 5, name: 'Greek Yogurt (Plain)', zone: 'chilled', category: 'Dairy', expiry: 'Fresh till Nov 18', img: 'https://images.unsplash.com/photo-1488477181946-6428a0291777?q=80&w=400&auto=format&fit=crop' },
      { id: 6, name: 'Organic Cherry Tomatoes', zone: 'pantry', category: 'Produce', expiry: 'Eat soon (2 days)', img: 'https://images.unsplash.com/photo-1592924357228-91a4daadcfea?q=80&w=400&auto=format&fit=crop' }
    ];

    // UI Drawer Elements
    const drawer = document.getElementById('drawer');
    const backdrop = document.getElementById('drawer-backdrop');
    const openMenuBtn = document.getElementById('open-menu');
    const closeMenuBtn = document.getElementById('close-menu');

    // Drawer Toggle Logic
    function openDrawer() {
      drawer.classList.remove('-translate-x-full');
      backdrop.classList.remove('opacity-0', 'pointer-events-none');
    }

    function closeDrawer() {
      drawer.classList.add('-translate-x-full');
      backdrop.classList.add('opacity-0', 'pointer-events-none');
    }

    openMenuBtn.addEventListener('click', openDrawer);
    closeMenuBtn.addEventListener('click', closeDrawer);
    backdrop.addEventListener('click', closeDrawer);

    // Inventory Modal Logic
    const inventoryModal = document.getElementById('inventory-modal');
    const closeInventoryBtn = document.getElementById('close-inventory');
    const viewTitle = document.getElementById('view-title');
    const inventoryGrid = document.getElementById('inventory-grid');

    function selectCategory(zone) {
      closeDrawer();
      inventoryModal.classList.remove('hidden');
      inventoryModal.classList.add('flex');

      let filteredItems = inventoryData;
      let titleText = 'All Storage';

      if (zone === 'chilled') {
        filteredItems = inventoryData.filter(i => i.zone === 'chilled' || i.zone === 'pantry');
        titleText = 'Cold Store';
      } else if (zone === 'pantry') {
        filteredItems = inventoryData.filter(i => i.zone === 'pantry');
        titleText = 'Pantry (Cold Shelf & Door)';
      } else if (zone === 'freezer') {
        filteredItems = inventoryData.filter(i => i.zone === 'freezer');
        titleText = 'Freezer Zone';
      } else if (zone === 'outside') {
        filteredItems = inventoryData.filter(i => i.zone === 'outside');
        titleText = 'Outside Storage';
      }

      viewTitle.textContent = titleText;
      renderGrid(filteredItems);
    }

    function renderGrid(items) {
      inventoryGrid.innerHTML = items.map(item => `
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden hover:border-zinc-700 transition-all">
          <div class="h-44 w-full bg-zinc-950 relative overflow-hidden">
            <img src="${item.img}" alt="${item.name}" class="w-full h-full object-cover">
            <span class="absolute top-3 right-3 px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider bg-black/60 backdrop-blur-md text-white border border-white/10">
              ${item.zone}
            </span>
          </div>
          <div class="p-4 space-y-2">
            <h4 class="font-semibold text-white">${item.name}</h4>
            <p class="text-xs text-emerald-400 font-medium">${item.expiry}</p>
          </div>
        </div>
      `).join('');
    }

    closeInventoryBtn.addEventListener('click', () => {
      inventoryModal.classList.add('hidden');
      inventoryModal.classList.remove('flex');
    });

    // Scan Modal Toggle
    const scanModal = document.getElementById('scan-modal');
    document.getElementById('open-scan').addEventListener('click', () => {
      scanModal.classList.remove('hidden');
      scanModal.classList.add('flex');
    });
    document.getElementById('close-scan').addEventListener('click', () => {
      scanModal.classList.add('hidden');
      scanModal.classList.remove('flex');
    });
    document.getElementById('finish-scan').addEventListener('click', () => {
      scanModal.classList.add('hidden');
      scanModal.classList.remove('flex');
      selectCategory('all');
    });
  </script>
</body>
</html>
